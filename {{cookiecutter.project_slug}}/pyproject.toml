[project]
name = "{{ cookiecutter.project_slug }}"
description = "A short description of the project"
readme = "README.md"
license = "MIT"
authors = [{ name = "{{ cookiecutter.full_name }}", email = "{{ cookiecutter.email }}" }]
keywords = ["{{ cookiecutter.project_slug }}", "example", "template"]
requires-python = ">={{cookiecutter.python_version}}"
version = "{{cookiecutter.version}}"

dependencies = [
    "loguru",
    "more-itertools>=10.7.0",
]


[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest",
    "pytest-datadir",
    "pytest-cov",
    "pytest-html",
    "pytest-mock",
    "faker",
    "pytest-print",
    "ruff",
    "ty",
    "pre-commit",
]

{% if cookiecutter.use_analytics == "y" -%}
[project.optional-dependencies]
analytics = [
    "jupyter",
    "pandas",
    "matplotlib",
    "seaborn",
    "plotly",
    "ipykernel"
]
{% endif %}


[tool.ruff]
# https://docs.astral.sh/ruff/rules/
lint.select = [
    "F",   # Pyflakes
    "E",   # pycodestyle Error
    "W",   # pycodestyle Warning
    "C90", # mccabe
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "YTT", # flake8-2020
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
    "BLE", # flake8-blind-except
    "FBT", # flake8-boolean-trap
    "B",   # flake8-bugbear
    "A",   # flake8-builtins
    "C40", # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "EM",  # flake8-errmsg
    "EXE", # flake8-executable
    "ISC", # flake8-implicit-str-concat
    "ICN", # flake8-import-conventions
    "G",   # flake8-logging-format
    "INP", # flake8-no-pep420
    "PIE", # flake8-pie
    "T20", # flake8-print
    "PYI", # flake8-pyi
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SLF", # flake8-self
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PGH", # pygrep-hooks
    "PL",  # Pylint
    "TRY", # tryceratops
    "RUF", # Ruff-specific rules
]

lint.unfixable = ["B"]

# Exclude a variety of commonly ignored directories.
lint.exclude = [
    ".direnv",
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pytype",
    ".ruff_cache",
    ".venv",
    "__pypackages__",
    "_build",
    "build",
    "venv",
]

# Never enforce line length violations.
lint.ignore = ["E501"]

# Always generate Python {{ cookiecutter.python_version}} compatible code.
target-version = "py{{ cookiecutter.python_version.replace('.', '') }}"

# Same as Black.
line-length = 88


[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
"tests/**" = [
    "S101",    # assert is how pytest works
    "ANN",     # type annotations are optional in tests
    "INP001",  # tests are not a package
    "PLR2004", # magic values are fine in assertions
]
"notebooks/**" = [
    "T201",    # print is the point of a notebook
    "INP001",  # notebooks are not a package
    "E402",    # imports often live in later cells
]


[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10


[tool.pytest.ini_options]
testpaths = ["tests"]


[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_also = [
    "def __repr__",
    "if self\\.debug",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true

[tool.coverage.html]
directory = "coverage_html_report"
