name: Test Template

on:
  push:
  pull_request:

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        use_analytics: ["y", "n"]
        use_agent_instructions: ["y", "n"]

    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Generate project
        run: uvx cookiecutter --no-input -o "$RUNNER_TEMP" . use_analytics=${{ matrix.use_analytics }} use_agent_instructions=${{ matrix.use_agent_instructions }}
      - name: Build generated project
        working-directory: ${{ runner.temp }}/python-boilerplate
        run: |
          make build check_format
          uv build
      - name: Check notebooks folder matches use_analytics
        working-directory: ${{ runner.temp }}/python-boilerplate
        run: |
          if [ "${{ matrix.use_analytics }}" = "y" ]; then test -d notebooks; else test ! -e notebooks; fi
      - name: Check agent files match use_agent_instructions
        working-directory: ${{ runner.temp }}/python-boilerplate
        run: |
          if [ "${{ matrix.use_agent_instructions }}" = "y" ]; then
            test -f AGENTS.md
            test -f CLAUDE.md
            test -f .github/copilot-instructions.md
            test -f .cursor/rules/commands.mdc
            grep -q "make check" AGENTS.md
            grep -q "make check" .github/copilot-instructions.md
          else
            test ! -e AGENTS.md
            test ! -e CLAUDE.md
            test ! -e .cursor
            test ! -e .github/copilot-instructions.md
          fi
      - name: Check no unrendered cookiecutter variables
        working-directory: ${{ runner.temp }}/python-boilerplate
        run: |
          ! grep -rn 'cookiecutter' . --exclude-dir=.git --exclude-dir=__pycache__ | grep '{{' || exit 1
